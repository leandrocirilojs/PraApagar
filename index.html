<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Detector de Emoção</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --accent: #e8ff47;
      --accent2: #ff6b6b;
      --text: #f0f0f8;
      --muted: #5a5a7a;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(232,255,71,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,255,71,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: 100%;
      max-width: 480px;
    }

    /* Header */
    header {
      text-align: center;
    }

    header .label {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    header h1 span {
      color: var(--accent);
    }

    /* Camera card */
    .camera-card {
      position: relative;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .camera-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: var(--radius);
      padding: 1px;
      background: linear-gradient(135deg, var(--accent), transparent 50%, var(--accent2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 2;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: var(--radius);
      transform: scaleX(-1);
      background: #000;
    }

    /* Corner brackets */
    .corner {
      position: absolute;
      width: 20px;
      height: 20px;
      z-index: 3;
    }
    .corner-tl { top: 10px; left: 10px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
    .corner-tr { top: 10px; right: 10px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); }
    .corner-bl { bottom: 10px; left: 10px; border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); }
    .corner-br { bottom: 10px; right: 10px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }

    /* Scan line animation */
    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      z-index: 3;
      animation: scan 3s ease-in-out infinite;
    }

    @keyframes scan {
      0% { top: 0%; opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { top: 100%; opacity: 0; }
    }

    /* Status bar */
    .status-bar {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .status-dot.active {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .status-dot.face {
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #status {
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      transition: color 0.3s;
    }

    #status.active { color: var(--text); }

    /* Emotion display */
    .emotion-display {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      min-height: 80px;
      justify-content: center;
    }

    .emotion-main {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }

    .emotion-emoji {
      font-size: 2.5rem;
      line-height: 1;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .emotion-emoji.pop {
      transform: scale(1.3);
    }

    .emotion-name {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--accent);
      text-transform: capitalize;
      line-height: 1;
    }

    .emotion-bars {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .bar-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      width: 80px;
      flex-shrink: 0;
      text-transform: capitalize;
    }

    .bar-track {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--muted);
      transition: width 0.4s ease;
    }

    .bar-fill.top { background: var(--accent); }

    .bar-pct {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      color: var(--muted);
      width: 32px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Footer */
    footer {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="label">// Análise em Tempo Real</div>
    <h1>Detector de<br><span>Emoção</span></h1>
  </header>

  <div class="camera-card">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div class="scan-line"></div>
    <video id="video" autoplay muted playsinline></video>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="dot"></div>
    <span id="status">Carregando IA...</span>
  </div>

  <div class="emotion-display" id="emotionDisplay">
    <div class="emotion-main">
      <span class="emotion-emoji" id="emoji">—</span>
      <span class="emotion-name" id="emotionName">aguardando</span>
    </div>
    <div class="emotion-bars" id="bars"></div>
  </div>

  <footer>face-api.js · TinyFaceDetector · FaceExpressionNet</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
<script>
  const video = document.getElementById('video');
  const statusEl = document.getElementById('status');
  const dot = document.getElementById('dot');
  const emoji = document.getElementById('emoji');
  const emotionName = document.getElementById('emotionName');
  const barsEl = document.getElementById('bars');

  const emojiMap = {
    happy: '😄', sad: '😢', angry: '😠', fearful: '😨',
    disgusted: '🤢', surprised: '😲', neutral: '😐'
  };

  const emojiPT = {
    happy: 'feliz', sad: 'triste', angry: 'raiva', fearful: 'com medo',
    disgusted: 'enojado', surprised: 'surpreso', neutral: 'neutro'
  };

  function setStatus(msg, active = false, face = false) {
    statusEl.textContent = msg;
    statusEl.className = active ? 'active' : '';
    dot.className = 'status-dot' + (face ? ' face' : active ? ' active' : '');
  }

  function updateEmotion(detections) {
    if (!detections) {
      setStatus('Nenhum rosto detectado', false);
      emoji.textContent = '—';
      emotionName.textContent = 'aguardando';
      barsEl.innerHTML = '';
      return;
    }

    const exp = detections.expressions;
    const top = Object.keys(exp).reduce((a, b) => exp[a] > exp[b] ? a : b);
    const sorted = Object.entries(exp).sort((a, b) => b[1] - a[1]);

    setStatus(`Rosto detectado — ${(exp[top] * 100).toFixed(0)}% ${emojiPT[top] || top}`, true, true);

    // Update emoji with pop animation
    const newEmoji = emojiMap[top] || '🙂';
    if (emoji.textContent !== newEmoji) {
      emoji.classList.remove('pop');
      void emoji.offsetWidth;
      emoji.textContent = newEmoji;
      emoji.classList.add('pop');
      setTimeout(() => emoji.classList.remove('pop'), 300);
    }
    emotionName.textContent = emojiPT[top] || top;

    // Update bars
    barsEl.innerHTML = sorted.slice(0, 5).map(([name, val]) => `
      <div class="bar-row">
        <span class="bar-label">${emojiPT[name] || name}</span>
        <div class="bar-track">
          <div class="bar-fill ${name === top ? 'top' : ''}" style="width:${(val * 100).toFixed(1)}%"></div>
        </div>
        <span class="bar-pct">${(val * 100).toFixed(0)}%</span>
      </div>
    `).join('');
  }

  async function iniciarCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
  }

  async function carregarModelos() {
    setStatus('Carregando modelos...', true);
    const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
    setStatus('Pronto — aponte a câmera para um rosto', true);
  }

  function detectarEmocao() {
    setInterval(async () => {
      const det = await faceapi
        .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
        .withFaceExpressions();
      updateEmotion(det || null);
    }, 500);
  }

  async function iniciar() {
    try {
      await iniciarCamera();
      await carregarModelos();
      detectarEmocao();
    } catch (err) {
      setStatus('Erro: ' + err.message);
    }
  }

  iniciar();
</script>
</body>
</html>
