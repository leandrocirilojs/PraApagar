<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Detector de Emoção</title>
</head>
<body>

<h2>Detector de Emoção 😄</h2>
<video id="video" width="320" height="240" autoplay muted></video>
<p id="status">Carregando IA...</p>

<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<script>
const video = document.getElementById('video');
const status = document.getElementById('status');

// iniciar câmera
async function iniciarCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
}

// carregar modelos
async function carregarModelos() {
  status.innerText = "Carregando modelos...";

  await faceapi.nets.tinyFaceDetector.loadFromUri('./models');
  await faceapi.nets.faceExpressionNet.loadFromUri('./models');

  status.innerText = "Modelos carregados!";
}

// detectar emoção
function detectarEmocao() {
  setInterval(async () => {
    const detections = await faceapi
      .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
      .withFaceExpressions();

    if (detections) {
      const exp = detections.expressions;

      const emocao = Object.keys(exp).reduce((a, b) => 
        exp[a] > exp[b] ? a : b
      );

      status.innerText = "Emoção: " + emocao;
    } else {
      status.innerText = "Nenhum rosto detectado";
    }

  }, 500);
}

// iniciar tudo
async function iniciar() {
  await iniciarCamera();
  await carregarModelos();
  detectarEmocao();
}

iniciar();
</script>

</body>
</html>
